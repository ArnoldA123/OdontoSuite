name: CI

on:
  push:
    branches: [main, 'fix/**', 'feat/**', 'chore/**', 'refactor/**']
  pull_request:
    branches: [main]

# Defaults: SQLite para el job de quality (rapido, sin servicios).
# APP_KEY is deliberately absent here. It used to be exported as the literal
# `base64:$(php -r "echo base64_encode(random_bytes(32));")`, which GitHub never
# shell-interpolates, so it was not a valid 32-byte key and every test that
# touched the encrypter died on it. phpunit.xml owns the testing key.
env:
  APP_ENV: testing
  APP_DEBUG: true
  LOG_CHANNEL: stderr
  DB_CONNECTION: sqlite
  DB_DATABASE: database/database.sqlite
  MAIL_MAILER: log
  CACHE_DRIVER: array
  QUEUE_CONNECTION: sync
  SESSION_DRIVER: array
  BROADCAST_DRIVER: null

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, intl, sqlite, pdo_sqlite
          coverage: none

      # Must run BEFORE setup-node: `cache: 'pnpm'` shells out to `pnpm store
      # path` to build the cache key, and dies if pnpm is not installed yet.
      # The version comes from package.json's `packageManager` field.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # Version read from .nvmrc, so Node is declared in exactly one place.
      # `pnpm@11.5.0` declares `engines.node >= 22.13`; pinning 20 here made
      # the `pnpm store path` cache-key step die on `node:sqlite`.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      # Blocking: exits non-zero on the first file with a syntax error.
      # (Issue #15: the old loop piped through `grep -v ... || true`, so
      # this step could never fail.)
      - name: PHP syntax check
        run: |
          FAIL=0
          for f in $(find app -name "*.php" -not -path "*/vendor/*"); do
            if ! php -l "$f" > /dev/null 2>&1; then
              echo "::error file=$f::PHP syntax error"
              FAIL=1
            fi
          done
          if [ "$FAIL" -ne 0 ]; then
            echo "PHP syntax errors found (see annotations above)"
            exit 1
          fi
          echo "PHP syntax OK"

      - name: Validate JSON files
        run: |
          for f in composer.json package.json; do
            php -r "json_decode(file_get_contents('$f'), false, 512, JSON_THROW_ON_ERROR); echo '$f OK'.PHP_EOL;"
          done

      # Blocking: the tree is Pint-clean (540 files pass `pint --test`), so a
      # violation is a real regression, not pre-existing debt. This closes the
      # #15 follow-up that kept it non-blocking while the tree was dirty.
      - name: Lint backend (Laravel Pint dry-run)
        run: vendor/bin/pint --test

      - name: Lint frontend (ESLint)
        run: pnpm lint:check

      # Blocking (issue #23): every frontend module mounts under jsdom in a
      # smoke test, so a page that throws on mount turns this step red.
      - name: Frontend smoke (Vitest)
        run: pnpm test:js

      # Blocking: the tree is Prettier-clean. `.prettierignore` lists the
      # trees Prettier does not own (installed skills, archived changes, task
      # notes, closed plans, and the files other tools rewrite), so a finding
      # here is authored code that drifted.
      - name: Format check (Prettier)
        run: pnpm format:check

  backend-tests:
    name: Backend tests (MySQL)
    runs-on: ubuntu-latest
    # Deliberately NOT gated on `quality`. Chained through it, this job was
    # skipped on every one of the 56 runs the workflow has ever had, so the
    # MySQL suite never executed once — and a failing lint gate must never hide
    # whether the tests pass. They are independent concerns.

    # Sprint 4 fix (IM-1): los 28 tests viejos fallan con SQLite por
    # sentencias MODIFY COLUMN MySQL-specific. Usamos MySQL real como
    # service en CI (mismo motor que produccion).
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: odontosuite_test
          MYSQL_USER: odontosuite
          MYSQL_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u odontosuite -psecret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: odontosuite_test
      DB_USERNAME: odontosuite
      DB_PASSWORD: secret

    steps:
      # Full history: git-based guards (e.g. PacientesNegativeSpaceRulesTest
      # `git diff HEAD~5`, see #106) need refs the default depth-1 shallow
      # clone does not have. Other jobs stay shallow for speed.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, intl, mysql, pdo_mysql
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # Node suites (ShapeMorph, StateHandling, TokensModule...) import
      # composables that resolve 'vue' via node_modules. Without this step
      # the ESM import throws ERR_MODULE_NOT_FOUND and the tests fail with
      # misleading TypeErrors (sibling of #65: runner lacks what tests assume).
      # Ordering: pnpm BEFORE setup-node, same as quality (cache key shells
      # out to `pnpm store path`). Version from .nvmrc, single source.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Install ripgrep (source-grep guards, issue #65)
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y ripgrep
          fi
          rg --version

      - name: Wait for MySQL ready
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -u odontosuite -psecret --silent 2>/dev/null; then
              echo "MySQL ready"
              break
            fi
            echo "Waiting for MySQL... ($i)"
            sleep 2
          done

      - name: Run migrations on MySQL
        run: php artisan migrate --force

      - name: Run full test suite (MySQL)
        run: |
          # Sprint 4 fix (IM-1): con MySQL ya no necesitamos filtrar los
          # tests viejos que fallaban por MODIFY COLUMN. Corremos TODO.
          php artisan test

      - name: Verify routes are registered
        run: php artisan route:list --path=api | head -50

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    # Not gated on `quality`, for the same reason as backend-tests: this job
    # verifies `pnpm build`, which is exactly what was broken on main for a
    # month while the workflow reported red for an unrelated reason.
    steps:
      - uses: actions/checkout@v4

      # Same ordering requirement as the quality job.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # Same .nvmrc source as the quality job.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: public-build
          path: public/build
          retention-days: 7

  # Blocking: no new secret reaches the public history. `gitleaks` runs the
  # default rule set plus the project rules in `.gitleaks.toml` (a database
  # password written as a value and the XAMPP root shorthand the ODD notes
  # use). The scan is scoped to the commits this run publishes — the PR range
  # on `pull_request`, the pushed range on `push`, and `main..HEAD` for a new
  # branch or a force push whose pre-push commit is gone. A branch deletion
  # publishes no commit and exits green; a range that cannot resolve or
  # contains no commits fails, because gitleaks exits 0 on an unresolvable
  # range and that would be a false green. Never the whole history: the leak
  # SECURITY.md records is already public and would turn every run red. The
  # binary is pinned and verified against the published checksum, so the gate
  # cannot change under us.
  security:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          set -euo pipefail
          cd /tmp
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o gitleaks_checksums.txt
          grep "linux_x64.tar.gz" gitleaks_checksums.txt | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          /tmp/gitleaks version

      - name: Scan the published commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail
          ZERO="0000000000000000000000000000000000000000"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF"
            RANGE="origin/${BASE_REF}..HEAD"
          elif [ -z "${AFTER_SHA:-}" ] || [ "$AFTER_SHA" = "$ZERO" ]; then
            # Branch deletion: no commit is published, so there is nothing to
            # scan and failing here would red every deleted branch.
            echo "Branch deletion: no commit is published; nothing to scan."
            exit 0
          elif [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "$ZERO" ] \
            && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            RANGE="${BEFORE_SHA}..${AFTER_SHA}"
          else
            # New branch or force push: the pre-push commit is not reachable.
            git fetch --no-tags origin main
            RANGE="origin/main..HEAD"
          fi
          # gitleaks exits 0 when git cannot resolve the range, so a broken or
          # empty range would be a false green. Resolve both endpoints and
          # require at least one commit.
          for endpoint in "${RANGE%%..*}" "${RANGE##*..}"; do
            if ! git cat-file -e "${endpoint}^{commit}" 2>/dev/null; then
              echo "::error::Cannot resolve ${endpoint} from ${RANGE}."
              exit 1
            fi
          done
          COUNT=$(git rev-list --count "$RANGE")
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::${RANGE} contains no commits; refusing a false green."
            exit 1
          fi
          echo "Scanning ${RANGE} (${COUNT} commits)"
          /tmp/gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 1 --log-opts="$RANGE"
