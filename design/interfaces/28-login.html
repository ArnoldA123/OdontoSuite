<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1440" />
    <title>OdontoSuite · Iniciar sesión</title>
    <style>
      /* ============================================================
         Tokens — valores de design/system.md. Ninguno inventado.
         ============================================================ */
      :root {
        --color-accent: #0f7a5f;
        --color-accent-hover: #0a5f49;
        --color-accent-700: #084c3b;
        --color-accent-50: #f2f8f5;
        --color-accent-100: #c9e7dc;
        --color-accent-200: #93cdb9;
        --color-accent-300: #5cb195;

        --color-canvas: #f7f6f4;
        --color-surface-elevated: #ffffff;

        --color-text-primary: #1a1917;
        --color-text-secondary: #5c5a55;
        --color-text-tertiary: rgba(26, 24, 20, 0.3);

        --color-system-gray-500: #908b82;
        --color-system-gray-700: #3b3833;
        --color-hairline: rgba(26, 24, 20, 0.1);

        --color-danger: #ff3b30;
        --color-danger-bg: #ffebea;
        --color-danger-line: #ffd9d7;
        --color-danger-text: #a50e10;

        --radius-ios: 10px;
        --radius-panel: 22px;
        --radius-full: 9999px;

        --elevation-1: 0 1px 3px rgba(92, 90, 85, 0.04);
        --elevation-2: 0 2px 8px rgba(92, 90, 85, 0.06), 0 1px 2px rgba(92, 90, 85, 0.04);
        --elevation-3: 0 8px 16px rgba(92, 90, 85, 0.08), 0 2px 6px rgba(92, 90, 85, 0.06);
        --elevation-4: 0 16px 24px rgba(92, 90, 85, 0.12), 0 4px 8px rgba(92, 90, 85, 0.08);
        --focus-ring-default: 0 0 0 3px rgba(15, 122, 95, 0.2);

        --font-sans:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        --font-features-tabular-nums: 'tnum' 1, 'lnum' 1;

        /* Escala tipográfica — design/system.md §2.1 */
        --text-sm: 13px;
        --text-sm-line: 18px;
        --text-base: 15px;
        --text-base-line: 22px;
        --text-3xl: 30px;
        --text-3xl-line: 36px;

        --motion-fast: 120ms;
        --motion-normal: 200ms;
        --motion-slow: 320ms;
        --motion-easing-standard: cubic-bezier(0.4, 0, 0.2, 1);
        --motion-easing-decel: cubic-bezier(0, 0, 0.2, 1);
        --motion-easing-ios: cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }

      /* ============================================================
         Base
         ============================================================ */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        overflow: hidden;
        background: var(--color-accent-50);
      }

      body {
        margin: 0;
        width: 1440px;
        height: 900px;
        font-family: var(--font-sans);
        font-size: var(--text-base);
        line-height: var(--text-base-line);
        color: var(--color-text-primary);
        font-optical-sizing: auto;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      h1,
      p {
        margin: 0;
        padding: 0;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button,
      input {
        font: inherit;
        color: inherit;
      }

      svg {
        display: block;
      }

      .icon {
        width: 18px;
        height: 18px;
        flex: 0 0 auto;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      :focus-visible {
        outline: 2px solid var(--color-accent);
        outline-offset: 2px;
        box-shadow: var(--focus-ring-default);
      }

      .num {
        font-feature-settings: var(--font-features-tabular-nums);
      }

      /* ============================================================
         Única superficie: el campo de dientes en deriva infinita.
         Tres planos, tres velocidades, sin intervención del puntero.
         Cada plano repite su loseta de 900 px y sube 900 px: el bucle
         cierra sin costura.
         ============================================================ */
      .login {
        position: relative;
        height: 900px;
        overflow: hidden;
        background: var(--color-accent-50);
      }

      .field {
        position: absolute;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .field__drift {
        position: absolute;
        inset: 0;
        will-change: transform;
        animation: drift var(--drift, 140s) linear infinite;
      }

      .field__tile {
        position: absolute;
        top: 0;
        left: 0;
        width: 1440px;
        height: 900px;
      }

      .field__tile--next {
        top: 900px;
      }

      /* Los dos recursos del set se usan como máscara de alfa: la forma es el
         archivo original (diente1.png y cepillo-de-dientes.png, incrustados
         como data URI) y el color se pinta sólido, sin velo ni opacidad. */
      .motif {
        position: absolute;
        display: block;
        background-color: var(--color-accent-200);
        -webkit-mask-image: var(--glyph);
        mask-image: var(--glyph);
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-position: center;
        mask-position: center;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
      }

      }

      .field__layer--far .motif {
        background-color: var(--color-accent-100);
      }

      .field__layer--near .motif {
        background-color: var(--color-accent-200);
      }

      /* El cepillo es trazo fino: un paso más de tinta lo mantiene legible. */
      .field__layer--mid .motif--brush,
      .field__layer--near .motif--brush {
        background-color: var(--color-accent-300);
      }

      @keyframes drift {
        from {
          transform: translate3d(0, 0, 0);
        }
        to {
          transform: translate3d(0, -900px, 0);
        }
      }

      /* ============================================================
         Acceso: marca y tarjeta, una sola columna centrada.
         ============================================================ */
      .access {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 220px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
        animation: rise var(--motion-slow) var(--motion-easing-decel) backwards;
        animation-delay: 40ms;
      }

      .brand__mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        flex: 0 0 auto;
        border-radius: 9px;
        background: linear-gradient(180deg, var(--color-accent) 0%, var(--color-accent-hover) 100%);
        color: #ffffff;
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.04),
          var(--elevation-2),
          inset 0 1px 0 rgba(255, 255, 255, 0.32);
      }

      .brand__mark .icon {
        width: 20px;
        height: 20px;
        stroke-width: 1.5;
      }

      .brand__name {
        font-size: 17px;
        line-height: 22px;
        font-weight: 600;
        letter-spacing: -0.014em;
      }

      .brand__dot {
        width: 3px;
        height: 3px;
        border-radius: var(--radius-full);
        background: var(--color-text-tertiary);
      }

      .brand__clinic {
        font-size: var(--text-sm);
        line-height: var(--text-sm-line);
        color: var(--color-text-secondary);
      }

      .card {
        width: 404px;
        margin-top: 28px;
        padding: 32px 32px 30px;
        background: var(--color-surface-elevated);
        border: 1px solid var(--color-hairline);
        border-radius: var(--radius-panel);
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.04),
          var(--elevation-1),
          var(--elevation-3);
        transition: box-shadow var(--motion-slow) var(--motion-easing-decel);
        animation: materialize var(--motion-slow) var(--motion-easing-decel) backwards;
        animation-delay: 80ms;
      }

      .card:focus-within {
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.04),
          var(--elevation-2),
          var(--elevation-4);
      }

      .card__title {
        font-size: var(--text-3xl);
        line-height: var(--text-3xl-line);
        font-weight: 600;
        letter-spacing: -0.022em;
      }

      /* ---- Formulario ---- */
      .form {
        margin-top: 24px;
      }

      .field-row + .field-row {
        margin-top: 16px;
      }

      .field-row__label {
        display: block;
        margin-bottom: 7px;
        font-size: var(--text-sm);
        line-height: var(--text-sm-line);
        font-weight: 500;
        letter-spacing: -0.001em;
        transition: color var(--motion-normal) var(--motion-easing-standard);
      }

      .field-row:focus-within .field-row__label {
        color: var(--color-accent-700);
      }

      ::selection {
        background: var(--color-accent-100);
        color: var(--color-text-primary);
      }

      .input {
        display: block;
        width: 100%;
        height: 52px;
        padding: 0 15px;
        appearance: none;
        -webkit-appearance: none;
        background: var(--color-surface-elevated);
        border: 1px solid var(--color-system-gray-500);
        border-radius: var(--radius-ios);
        color: var(--color-text-primary);
        caret-color: var(--color-accent);
        font-family: var(--font-sans);
        font-size: var(--text-base);
        line-height: var(--text-base-line);
        transition:
          border-color var(--motion-normal) var(--motion-easing-standard),
          box-shadow var(--motion-normal) var(--motion-easing-standard);
      }

      .input::placeholder {
        color: var(--color-text-secondary);
        opacity: 1;
      }

      .input:hover {
        border-color: var(--color-system-gray-700);
      }

      .input:focus {
        border-color: var(--color-accent);
      }

      .input[aria-invalid='true'] {
        border-color: var(--color-danger);
      }

      .input[aria-invalid='true']:focus {
        border-color: var(--color-danger);
      }

      .input:-webkit-autofill,
      .input:-webkit-autofill:hover,
      .input:-webkit-autofill:focus {
        -webkit-text-fill-color: var(--color-text-primary);
        -webkit-box-shadow: 0 0 0 100px var(--color-surface-elevated) inset;
      }

      .input-group {
        position: relative;
      }

      .input--password {
        padding-right: 54px;
      }

      .reveal {
        position: absolute;
        top: 8px;
        right: 8px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        border: 0;
        border-radius: var(--radius-ios);
        background: transparent;
        color: var(--color-text-secondary);
        cursor: pointer;
        transition:
          background-color var(--motion-normal) var(--motion-easing-standard),
          color var(--motion-normal) var(--motion-easing-standard),
          transform var(--motion-fast) var(--motion-easing-ios);
      }

      .reveal__icons {
        position: relative;
        width: 17px;
        height: 17px;
      }

      .reveal__icons .icon {
        position: absolute;
        inset: 0;
        width: 17px;
        height: 17px;
        transition:
          opacity 160ms var(--motion-easing-standard),
          transform 160ms var(--motion-easing-ios);
      }

      .reveal:hover {
        background: var(--color-canvas);
        color: var(--color-text-primary);
      }

      .reveal:active {
        transform: scale(0.94);
      }

      .reveal__icon--off {
        opacity: 0;
        transform: scale(0.9);
      }

      .reveal[aria-pressed='true'] .reveal__icon--on {
        opacity: 0;
        transform: scale(0.9);
      }

      .reveal[aria-pressed='true'] .reveal__icon--off {
        opacity: 1;
        transform: scale(1);
      }

      .form__row {
        display: flex;
        justify-content: flex-end;
        margin-top: 11px;
      }

      .link {
        font-size: 12.5px;
        line-height: 20px;
        font-weight: 600;
        color: var(--color-accent);
        text-decoration: underline;
        text-decoration-color: var(--color-accent-200);
        text-decoration-thickness: 1px;
        text-underline-offset: 3px;
        border-radius: 4px;
        transition: text-decoration-color var(--motion-normal) var(--motion-easing-standard);
      }

      .link:hover {
        text-decoration-color: var(--color-accent);
      }

      /* ---- Rechazo del contrato ---- */
      .alert {
        display: flex;
        align-items: flex-start;
        gap: 9px;
        margin-bottom: 16px;
        padding: 10px 12px;
        background: var(--color-danger-bg);
        border: 1px solid var(--color-danger-line);
        border-radius: var(--radius-ios);
        color: var(--color-danger-text);
        animation: rise var(--motion-normal) var(--motion-easing-decel) backwards;
      }

      .alert[hidden] {
        display: none;
      }

      .alert:focus-visible {
        outline: 2px solid var(--color-danger);
        outline-offset: 2px;
      }

      .alert .icon {
        width: 15px;
        height: 15px;
        margin-top: 2px;
      }

      .alert p {
        font-size: 12.5px;
        line-height: 17px;
        letter-spacing: -0.001em;
      }

      /* ---- Envío ---- */
      .btn {
        position: relative;
        overflow: hidden;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        width: 100%;
        height: 52px;
        margin-top: 20px;
        padding: 0 20px;
        border: 1px solid transparent;
        border-radius: var(--radius-ios);
        font-family: var(--font-sans);
        font-size: 14px;
        line-height: 20px;
        font-weight: 600;
        letter-spacing: 0.002em;
        color: #ffffff;
        background: linear-gradient(180deg, var(--color-accent) 0%, var(--color-accent-hover) 100%);
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.04),
          var(--elevation-3),
          inset 0 1px 0 rgba(255, 255, 255, 0.32);
        cursor: pointer;
        transition:
          background-color var(--motion-normal) var(--motion-easing-standard),
          box-shadow var(--motion-normal) var(--motion-easing-standard),
          transform var(--motion-fast) var(--motion-easing-ios);
      }

      .btn::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(
          180deg,
          var(--color-accent-hover) 0%,
          var(--color-accent-700) 100%
        );
        opacity: 0;
        transition: opacity 260ms var(--motion-easing-standard);
      }

      .btn > * {
        position: relative;
        z-index: 1;
      }

      .btn:hover {
        transform: translateY(-1px);
      }

      .btn:hover::after {
        opacity: 1;
      }

      .btn:active {
        transform: translateY(0) scale(0.99);
      }

      .btn:disabled {
        cursor: default;
        transform: none;
      }

      .btn__spinner {
        width: 16px;
        height: 16px;
        border: 2px solid rgba(255, 255, 255, 0.32);
        border-top-color: #ffffff;
        border-radius: var(--radius-full);
        animation: spin 800ms linear infinite;
      }

      .btn__spinner[hidden] {
        display: none;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ---- Pie del artboard ---- */
      .artboard-meta {
        position: absolute;
        right: 18px;
        bottom: 14px;
        z-index: 1;
        font-size: 11px;
        line-height: 15px;
        text-align: right;
        color: var(--color-text-secondary);
        font-feature-settings: var(--font-features-tabular-nums);
      }

      .btn:focus-visible,
      .input:focus-visible,
      .reveal:focus-visible,
      .link:focus-visible {
        box-shadow: var(--focus-ring-default);
      }

      /* ============================================================
         Entrada — materializa, no sólo aparece
         ============================================================ */
      @keyframes materialize {
        from {
          opacity: 0;
          transform: translateY(10px) scale(0.985);
          filter: blur(6px);
        }
        to {
          opacity: 1;
          transform: none;
          filter: blur(0);
        }
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      /* ============================================================
         Preferencias del sistema
         ============================================================ */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 1ms !important;
          animation-delay: 0ms !important;
          transition-duration: 1ms !important;
        }

        .field__drift,
        .btn__spinner {
          animation: none !important;
        }

        .btn:hover,
        .btn:active,
        .reveal:active {
          transform: none;
        }
      }

      @media (prefers-contrast: more) {
        .input {
          border-color: var(--color-text-secondary);
        }

        .field {
          opacity: 0.45;
        }
      }
    </style>
  </head>

    <script>
      ;(() => {
        const reveal = document.querySelector('[data-reveal]')
        const password = document.getElementById('login-password')
        const email = document.getElementById('login-email')

        reveal.addEventListener('click', () => {
          const hidden = password.type === 'password'
          password.type = hidden ? 'text' : 'password'
          reveal.setAttribute('aria-pressed', String(hidden))
          const label = hidden ? 'Ocultar contraseña' : 'Mostrar contraseña'
          reveal.setAttribute('aria-label', label)
          reveal.setAttribute('title', label)
        })

        /* El formulario limpio se convierte en el rechazo del contrato
           sin mover la tarjeta de su sitio. */
        const form = document.querySelector('[data-login-form]')
        const alert = document.querySelector('[data-auth-error]')
        const button = document.querySelector('[data-submit]')
        const buttonLabel = document.querySelector('[data-submit-label]')
        const spinner = document.querySelector('[data-spinner]')
        const status = document.createElement('span')
        status.className = 'sr-only'
        status.setAttribute('role', 'status')
        form.append(status)

        let busy = false

        form.addEventListener('submit', event => {
          event.preventDefault()
          if (busy) return

          busy = true
          button.disabled = true
          button.setAttribute('aria-busy', 'true')
          alert.hidden = true
          spinner.hidden = false
          buttonLabel.textContent = 'Verificando'
          status.textContent = 'Verificando credenciales'
          email.removeAttribute('aria-invalid')
          password.removeAttribute('aria-invalid')

          window.setTimeout(() => {
            busy = false
            button.disabled = false
            button.removeAttribute('aria-busy')
            spinner.hidden = true
            buttonLabel.textContent = 'Entrar'
            status.textContent = ''
            alert.hidden = false
            email.setAttribute('aria-invalid', 'true')
            password.setAttribute('aria-invalid', 'true')
            alert.focus()
          }, 1200)
        })
        ;[email, password].forEach(input => {
          input.addEventListener('input', () => {
            input.removeAttribute('aria-invalid')
            alert.hidden = true
          })
        })
      })()
    </script>
  </body>
</html>
