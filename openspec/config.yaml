    - Frontend: PascalCase .vue, camelCase composables, <script setup>
    - Comments: minimal, professional (no pedagogical commentary)
    - Language: code in English, conversation in Spanish (Peru)

# Capability detection for testing/lint/format pipelines
testing:
  backend:
    runner: phpunit
    version: "^11.5"
    config: phpunit.xml
    test_command: "php artisan test"
    testsuites:
      - Unit: tests/Unit
      - Feature: tests/Feature
    local_db: sqlite_in_memory
    ci_db: mysql_8.0
    ci_db_notes: "28 pre-existing tests fail on SQLite with MODIFY COLUMN; CI uses MySQL service to make them pass."
    env_overrides:
      BROADCAST_CONNECTION: null
      APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      CACHE_STORE: array
  frontend:
    runner: eslint_prettier
    eslint: "pnpm lint:check"
    prettier: "pnpm format:check"
    build: "pnpm build"
    js_unit_runner: none
  coverage:
    threshold: 0
    enforced: false
  strict_tdd: true
  strict_tdd_source: "user_gl_marker (CLAUDE.md) + AGENTS.md §3 (composer dev workflow + test scripts)"

# Per-phase rules
rules:
  proposal:
    - Include rollback plan for risky changes
    - Reference affected modules/controllers (± from AGENTS.md §4)
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Map changes to one of 17 frontend modules and/or 36 API controllers
  design:
    - Include sequence diagrams for API flows that touch multi-role middleware
    - Reference existing services/ instead of inventing new abstractions
    - Document any new event/listener wiring in AppServiceProvider
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - Respect 400-line review budget (forecast per task batch)
  apply:
    guidelines:
      - Follow existing code patterns (Services*, Controllers\Api, Composables)
      - Use pnpm exclusively — never npm/yarn
      - Use useApi() wrapper in frontend — never axios directly
      - Use <script setup> Composition API — never Options API for new code
      - Use existing UI primitives from resources/js/components/ui/
    tdd: true
    test_command: "php artisan test"
  verify:
    test_command: "php artisan test"
    build_command: "pnpm build"
    lint_command: "pnpm lint:check"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
    - Verify ADR alignment (0007 user-specialty, 0008 catalog legacy specialty)

